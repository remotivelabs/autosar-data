[package]
name = "autosar-data-specification"
version = "0.23.0"
authors = ["Daniel Thaler <daniel@dthaler.de>"]
edition = "2024"
description = "specification of the Autosar arxml file format as rust data structures"
license = "MIT OR Apache-2.0"
keywords = ["arxml", "automotive", "file-format", "Autosar"]
categories = ["parser-implementations"]
repository = "https://github.com/DanielT/autosar-data"

[features]
docstrings = []

[dependencies]
num-traits = "0.2.16"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# only used by the regex benchmark, as an independent implementation of the patterns in regex.rs
regex = "1.11"

[[bench]]
name = "regex"
harness = false
